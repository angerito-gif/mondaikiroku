<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="間違えた問題を記録して、忘却曲線に沿って復習日を自動で決める受験勉強アプリ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="問題記録">
  <title>問題記録</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="appbar">
    <h1 id="title">今日の復習</h1>
  </header>

  <main>
    <section id="view-home" class="view" aria-live="polite"></section>

    <section id="view-add" class="view" hidden>
      <form id="add-form" autocomplete="off" novalidate>
        <div class="field">
          <label for="f-book">問題集</label>
          <input id="f-book" name="book" placeholder="例：青チャートIA" enterkeyhint="next">
          <div class="chips scroll" id="sug-book"></div>
        </div>
        <div class="field">
          <label for="f-subject">科目</label>
          <input id="f-subject" name="subject" placeholder="例：数学" enterkeyhint="next">
          <div class="chips scroll" id="sug-subject"></div>
        </div>
        <div class="field">
          <label for="f-unit">単元 <span class="opt">任意</span></label>
          <input id="f-unit" name="unit" placeholder="例：二次関数" enterkeyhint="next">
          <div class="chips scroll" id="sug-unit"></div>
        </div>
        <div class="row">
          <div class="field page-field">
            <label for="f-page">ページ</label>
            <input id="f-page" name="page" inputmode="numeric" placeholder="52" enterkeyhint="next">
          </div>
          <div class="field grow">
            <label for="f-number">問題番号</label>
            <div class="number-wrap">
              <input id="f-number" name="number" inputmode="numeric" placeholder="3, 5, 7-9" enterkeyhint="done">
              <button type="button" class="key" data-ins=", " aria-label="カンマを入力">,</button>
              <button type="button" class="key" data-ins="-" aria-label="ハイフンを入力">-</button>
              <button type="button" class="key" id="kbd-toggle" aria-label="キーボード切替">あ</button>
            </div>
          </div>
        </div>
        <p id="num-preview" class="hint"></p>
        <button type="submit" class="btn primary big">登録する</button>
      </form>
      <div id="recent-added"></div>
    </section>

    <section id="view-list" class="view" hidden></section>
    <section id="view-stats" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav class="tabbar" aria-label="メニュー">
    <a href="#home" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>ホーム</span><b class="badge" id="badge" hidden></b>
    </a>
    <a href="#list" data-view="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>一覧</span>
    </a>
    <a href="#add" data-view="add" class="tab-add" aria-label="登録">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="#stats" data-view="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>統計</span>
    </a>
    <a href="#settings" data-view="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="modal"></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
